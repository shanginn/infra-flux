apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: temporal-system
resources:
  - namespace.yaml
  - services.yaml
  - workloads.yaml
  - network-policy.yaml
configMapGenerator:
  - name: temporal-config
    files:
      - unified.yaml=config/unified.yaml
  - name: temporal-dynamic-config
    files:
      - dynamic_config.yaml=config/dynamic_config.yaml
