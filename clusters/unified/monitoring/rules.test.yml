rule_files:
  - rules.yml
evaluation_interval: 1m
tests:
  - name: public-dns-eight-target-coverage-deduplicates-rollouts-and-detects-down-or-removed-target
    interval: 1m
    input_series:
      - series: 'up{job="public-dns-msk-udp",dns_site="msk",protocol="udp",probe_node="msk",instance="original"}'
        values: '1+0x12'
      - series: 'up{job="public-dns-msk-udp",dns_site="msk",protocol="udp",probe_node="fin",instance="original"}'
        values: '1+0x12'
      - series: 'up{job="public-dns-msk-tcp",dns_site="msk",protocol="tcp",probe_node="msk",instance="original"}'
        values: '1+0x12'
      - series: 'up{job="public-dns-msk-tcp",dns_site="msk",protocol="tcp",probe_node="fin",instance="original"}'
        values: '1+0x12'
      - series: 'up{job="public-dns-fin-udp",dns_site="fin",protocol="udp",probe_node="msk",instance="original"}'
        values: '1+0x12'
      - series: 'up{job="public-dns-fin-udp",dns_site="fin",protocol="udp",probe_node="fin",instance="original"}'
        values: '1+0x12'
      - series: 'up{job="public-dns-fin-tcp",dns_site="fin",protocol="tcp",probe_node="msk",instance="original"}'
        values: '1+0x12'
      - series: 'up{job="public-dns-fin-tcp",dns_site="fin",protocol="tcp",probe_node="fin",instance="original"}'
        values: '1+0x3 0+0x3 stale'
      - series: 'up{job="public-dns-msk-udp",dns_site="msk",protocol="udp",probe_node="msk",instance="rollout-duplicate"}'
        values: '1+0x12'
      - series: 'up{job="unrelated",dns_site="fin",protocol="tcp",probe_node="fin",instance="unrelated"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 3m
        alertname: PublicAuthorityDNSProbeCoverageUnexpected
        exp_alerts: []
      - eval_time: 6m
        alertname: PublicAuthorityDNSProbeCoverageUnexpected
        exp_alerts: []
      - eval_time: 7m
        alertname: PublicAuthorityDNSProbeCoverageUnexpected
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: Expected eight reachable authoritative DNS probe targets across both VPS}
      - eval_time: 10m
        alertname: PublicAuthorityDNSProbeCoverageUnexpected
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: Expected eight reachable authoritative DNS probe targets across both VPS}
  - name: public-dns-total-probe-disappearance-still-alerts
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: PublicAuthorityDNSProbeCoverageUnexpected
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: Expected eight reachable authoritative DNS probe targets across both VPS}
  - name: bind-zone-coverage-detects-one-missing-zone-and-empty-exporter-without-counting-duplicates
