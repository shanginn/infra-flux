apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications-searxng-mrcatcha
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/unified/applications/searxng/mrcatcha
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra-flux
