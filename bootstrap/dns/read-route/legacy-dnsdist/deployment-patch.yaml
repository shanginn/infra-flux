apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibesites-dnsdist
spec:
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        infra.shanginn.io/dnsdist-config-revision: ${LEGACY_DNS_READ_ROUTE_REVISION}
    spec:
      containers:
      - name: dnsdist
        args:
        - |
          set -- "$(getent hosts bind9-service.bind9.svc.cluster.local | awk '{print $1; exit}')"
          test -n "$1"
          sed -e "s/__BIND9_ADDRESS__/$1:53/g" /etc/dnsdist/dnsdist.conf > /tmp/dnsdist.conf
          exec dnsdist --supervised --disable-syslog --config /tmp/dnsdist.conf
