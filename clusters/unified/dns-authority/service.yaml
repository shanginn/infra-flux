apiVersion: v1
kind: Service
metadata:
  name: bind-authority
spec:
  clusterIP: 10.120.53.53
  selector: {app: bind-authority}
  internalTrafficPolicy: Local
  ports:
    - {name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: bind-authority-peers
spec:
  clusterIP: None
  selector: {app: bind-authority}
  ports:
    - {name: dns-udp, port: 5353, targetPort: dns-udp, protocol: UDP}
    - {name: dns-tcp, port: 5353, targetPort: dns-tcp, protocol: TCP}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bind-authority
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: bind-authority}
