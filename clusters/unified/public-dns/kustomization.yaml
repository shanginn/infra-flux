apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: public-dns
resources:
  - namespace.yaml
  - rbac.yaml
  - monitoring-rbac.yaml
  - daemonset.yaml
  - network-policy.yaml
configMapGenerator:
  - name: public-dns-config
    files: [Corefile, settings.json, controller.py]
  - name: public-dns-zone
    files: [state.json]
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
        kustomize.toolkit.fluxcd.io/prune: Disabled
