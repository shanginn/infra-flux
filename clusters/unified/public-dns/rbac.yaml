apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-dns
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: public-dns
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: Disabled
spec:
  leaseDurationSeconds: 35
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-dns
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [public-dns-zone]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [public-dns]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-dns
subjects:
  - kind: ServiceAccount
    name: public-dns
    namespace: public-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-dns
