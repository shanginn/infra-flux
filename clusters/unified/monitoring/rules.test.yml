rule_files:
  - rules.yml
evaluation_interval: 1m
tests:
  - name: Detect repeated etcd restarts without warning on a single restart or unrelated container
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="kube-system",pod="etcd-home",container="etcd",instance="ksm-one"}'
        values: '0+0x4 1+0x4 2+0x10'
      - series: 'kube_pod_container_status_restarts_total{namespace="kube-system",pod="etcd-home",container="etcd",instance="ksm-two"}'
        values: '0+0x4 1+0x4 2+0x10'
      - series: 'kube_pod_container_status_restarts_total{namespace="kube-system",pod="etcd-fin",container="etcd",instance="ksm-one"}'
        values: '0+0x4 1+0x15'
      - series: 'kube_pod_container_status_restarts_total{namespace="kube-system",pod="kube-apiserver-msk",container="kube-apiserver",instance="ksm-one"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: EtcdRepeatedRestarts
        exp_alerts: []
      - eval_time: 11m
        alertname: EtcdRepeatedRestarts
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: kube-system
              pod: etcd-home
              container: etcd
            exp_annotations:
              summary: 'etcd etcd-home restarted at least twice in 20 minutes; inspect startup, catch-up and transport health'
  - name: duplicate-state-exporters-do-not-double-requests
    interval: 1m
    input_series:
      - series: 'kube_pod_container_resource_requests{namespace="app",pod="web-0",container="web",node="home",resource="memory",instance="ksm1"}'
        values: '128+0x10'
      - series: 'kube_pod_container_resource_requests{namespace="app",pod="web-0",container="web",node="home",resource="memory",instance="ksm2"}'
        values: '128+0x10'
      - series: 'kube_pod_container_resource_requests{namespace="app",pod="web-1",container="web",node="home",resource="memory",instance="ksm1"}'
        values: '64+0x10'
    promql_expr_test:
      - expr: node_resource:container_requests:sum
        eval_time: 5m
        exp_samples:
          - labels: 'node_resource:container_requests:sum{node="home",resource="memory"}'
            value: 192
  - name: pending-serving-csr-needs-human-review-approved-does-not
    interval: 1m
    input_series:
      - series: 'kube_certificatesigningrequest_created{certificatesigningrequest="csr-pending",signer_name="kubernetes.io/kubelet-serving"}'
        values: '0+0x20'
      - series: 'kube_certificatesigningrequest_condition{certificatesigningrequest="csr-pending",signer_name="kubernetes.io/kubelet-serving",condition="approved"}'
        values: '0+0x20'
      - series: 'kube_certificatesigningrequest_condition{certificatesigningrequest="csr-pending",signer_name="kubernetes.io/kubelet-serving",condition="denied"}'
        values: '0+0x20'
      - series: 'kube_certificatesigningrequest_created{certificatesigningrequest="csr-approved",signer_name="kubernetes.io/kubelet-serving"}'
        values: '0+0x20'
      - series: 'kube_certificatesigningrequest_condition{certificatesigningrequest="csr-approved",signer_name="kubernetes.io/kubelet-serving",condition="approved"}'
        values: '1+0x20'
      - series: 'kube_certificatesigningrequest_condition{certificatesigningrequest="csr-approved",signer_name="kubernetes.io/kubelet-serving",condition="denied"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: KubeletServingCSRPending
        exp_alerts: []
      - eval_time: 15m
        alertname: KubeletServingCSRPending
        exp_alerts:
          - exp_labels: {certificatesigningrequest: csr-pending, signer_name: kubernetes.io/kubelet-serving, severity: warning}
            exp_annotations: {summary: 'Serving CSR csr-pending is pending manual identity review; never approve all requests'}
  - name: old-oom-does-not-alert-indefinitely
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="app",pod="web",container="web",reason="OOMKilled"}'
        values: '1+0x20'
      - series: 'kube_pod_container_status_last_terminated_timestamp{namespace="app",pod="web",container="web"}'
        values: '60+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: KubernetesContainerOOMKilled
        exp_alerts:
          - exp_labels: {namespace: app, pod: web, container: web, severity: warning}
            exp_annotations: {summary: 'Container app/web/web recently exhausted memory'}
      - eval_time: 15m
        alertname: KubernetesContainerOOMKilled
        exp_alerts: []
  - name: glitchtip-storage-latch-and-stale-guard
    interval: 1m
    input_series:
      - series: glitchtip_capacity_guard_latched
        values: '1+0x10'
      - series: glitchtip_capacity_guard_last_success_timestamp_seconds
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: GlitchTipGuardStale
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: GlitchTip capacity guard has not succeeded within three minutes}
      - eval_time: 1m
        alertname: GlitchTipIngestionClosed
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: GlitchTip capacity guard closed event ingestion; explicit storage review is required to reopen it}
  - name: standby-headscale-inactive-is-correct-unexpected-active-alerts
    interval: 1m
    input_series:
      - series: 'infra_service_active{instance="standby:9100",node="standby",service="infra-headscale.service"}'
        values: '0+0x4 1+0x10'
      - series: 'infra_service_expected_active{instance="standby:9100",node="standby",service="infra-headscale.service"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: RequiredHostServiceInactive
        exp_alerts: []
      - eval_time: 8m
        alertname: RequiredHostServiceInactive
        exp_alerts:
          - exp_labels: {instance: 'standby:9100', node: standby, service: infra-headscale.service, severity: critical}
            exp_annotations: {summary: 'Service infra-headscale.service on standby differs from its declared active/standby state'}
  - name: configured-loki-missing-owned-mount-metric-alerts
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="logging",deployment="loki",instance="ksm1"}'
        values: '1+0x10'
      - series: 'kube_deployment_spec_replicas{namespace="logging",deployment="loki",instance="ksm2"}'
        values: '1+0x10'
      - series: 'node_filesystem_avail_bytes{node="home",mountpoint="/"}'
        values: '1000000000+0x10'
      - series: 'node_filesystem_avail_bytes{node="msk",mountpoint="/var/lib/infra-logging/loki"}'
        values: '1000000000+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: LokiFilesystemMetricsMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: LokiFilesystemMetricsMissing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: 'Configured Loki filesystem has no free-space metric; inspect its mount and collector permissions'}
  - name: disabled-loki-does-not-alert-on-missing-or-error-metric
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="logging",deployment="loki"}'
        values: '0+0x10'
      - series: 'node_filesystem_device_error{node="home",mountpoint="/var/lib/infra-logging/loki"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: LokiFilesystemMetricsMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: LokiFilesystemCollectionFailed
        exp_alerts: []
  - name: configured-loki-owned-mount-error-alerts
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="logging",deployment="loki"}'
        values: '1+0x10'
      - series: 'node_filesystem_device_error{node="home",mountpoint="/var/lib/infra-logging/loki",device="/dev/loop0",device_error="permission denied"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: LokiFilesystemCollectionFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: LokiFilesystemCollectionFailed
        exp_alerts:
          - exp_labels: {node: home, severity: warning}
            exp_annotations: {summary: 'Node exporter cannot inspect the owned Loki filesystem on home'}
  - name: healthy-loki-mount-does-not-alert-on-unrelated-filesystem-error
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="logging",deployment="loki"}'
        values: '1+0x10'
      - series: 'node_filesystem_avail_bytes{node="home",mountpoint="/var/lib/infra-logging/loki"}'
        values: '1000000000+0x10'
      - series: 'node_filesystem_device_error{node="home",mountpoint="/var/lib/infra-logging/loki"}'
        values: '0+0x10'
      - series: 'node_filesystem_device_error{node="home",mountpoint="/run/containerd/other"}'
        values: '1+0x10'
      - series: 'node_filesystem_device_error{node="msk",mountpoint="/var/lib/infra-logging/loki"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: LokiFilesystemMetricsMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: LokiFilesystemCollectionFailed
        exp_alerts: []
  - name: sustained-cpu-throttling-needs-both-material-time-and-high-period-ratio
    interval: 1m
    input_series:
      # Frequent tiny collection bursts: high fraction of active periods, little lost time.
      - series: 'container_cpu_cfs_periods_total{job="cadvisor",namespace="app",pod="sparse",container="worker"}'
        values: '0+60x25'
      - series: 'container_cpu_cfs_throttled_periods_total{job="cadvisor",namespace="app",pod="sparse",container="worker"}'
        values: '0+30x25'
      - series: 'container_cpu_cfs_throttled_seconds_total{job="cadvisor",namespace="app",pod="sparse",container="worker"}'
        values: '0+0.6x25'
      # Material continuous contention: 50% of periods and 0.2 throttled seconds/s.
      - series: 'container_cpu_cfs_periods_total{job="cadvisor",namespace="app",pod="busy",container="worker"}'
        values: '0+60x25'
      - series: 'container_cpu_cfs_throttled_periods_total{job="cadvisor",namespace="app",pod="busy",container="worker"}'
        values: '0+30x25'
      - series: 'container_cpu_cfs_throttled_seconds_total{job="cadvisor",namespace="app",pod="busy",container="worker"}'
        values: '0+12x25'
      # Large individual delays alone do not meet the sustained period-ratio condition.
      - series: 'container_cpu_cfs_periods_total{job="cadvisor",namespace="app",pod="low-ratio",container="worker"}'
        values: '0+60x25'
      - series: 'container_cpu_cfs_throttled_periods_total{job="cadvisor",namespace="app",pod="low-ratio",container="worker"}'
        values: '0+6x25'
      - series: 'container_cpu_cfs_throttled_seconds_total{job="cadvisor",namespace="app",pod="low-ratio",container="worker"}'
        values: '0+12x25'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerCPUThrottlingHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: ContainerCPUThrottlingHigh
        exp_alerts:
          - exp_labels: {namespace: app, pod: busy, container: worker, severity: warning}
            exp_annotations: {summary: 'CPU quota throttles more than 25% of periods and 0.1 seconds/s for app/busy/worker'}
