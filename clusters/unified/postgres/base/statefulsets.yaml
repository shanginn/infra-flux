apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unified-pg-msk
  namespace: database
spec:
  serviceName: unified-postgres-members
  replicas: 0
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: patroni
      cluster-name: unified-postgres
      member-site: msk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patroni
        cluster-name: unified-postgres
        member-site: msk
    spec:
      serviceAccountName: patroni
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 19999
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/hostname: msk
        infra.shanginn.io/site: msk
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: patroni
                cluster-name: unified-postgres
            topologyKey: kubernetes.io/hostname
      containers:
      - name: postgres
        image: ${POSTGRES_IMAGE}
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: FENCING_MODE
          value: manual-verified-off
        - name: FAILOVER_PRIORITY
          value: '100'
        ports:
        - name: postgresql
          containerPort: 5432
        - name: patroni
          containerPort: 8008
        securityContext:
          runAsNonRoot: true
          runAsUser: 19999
          runAsGroup: 19999
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 3Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: configuration
          mountPath: /etc/patroni
          readOnly: true
        - name: credentials
          mountPath: /etc/patroni-credentials
          readOnly: true
        - name: tls
          mountPath: /etc/postgres-tls
          readOnly: true
        - name: runtime
          mountPath: /run/patroni
        - name: socket
          mountPath: /run/postgresql
        - name: tmp
          mountPath: /tmp
        - name: dshm
          mountPath: /dev/shm
        startupProbe:
          httpGet:
            path: /liveness
            port: patroni
          periodSeconds: 10
          failureThreshold: 180
        livenessProbe:
          httpGet:
            path: /liveness
            port: patroni
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readiness?lag=16MB
            port: patroni
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: unified-pg-msk
      - name: configuration
        configMap:
          name: patroni-configuration
      - name: credentials
        secret:
          secretName: patroni-credentials
          defaultMode: 288
      - name: tls
        secret:
          secretName: patroni-server-tls
          defaultMode: 288
      - name: runtime
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: socket
        emptyDir: {}
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
---
