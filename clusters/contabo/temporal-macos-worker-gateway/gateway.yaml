apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-macos-worker-gateway
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal-macos-worker-gateway
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr info;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    stream {
        server {
            listen 7233 ssl;
            proxy_pass temporal-frontend.temporal.svc.cluster.local:7233;
            proxy_connect_timeout 10s;
            proxy_timeout 24h;
            proxy_socket_keepalive on;

            ssl_certificate /etc/nginx/tls/tls.crt;
            ssl_certificate_key /etc/nginx/tls/tls.key;
            ssl_client_certificate /etc/nginx/tls/ca.crt;
            ssl_verify_client on;
            ssl_verify_depth 1;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_alpn h2;
            ssl_session_cache shared:TemporalTLS:1m;
            ssl_session_timeout 10m;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-macos-worker-gateway
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal-macos-worker-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-macos-worker-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-macos-worker-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: nginx@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: mtls-grpc
              containerPort: 7233
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: mtls-grpc
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mtls-grpc
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: temporal-macos-worker-gateway
        - name: tls
          secret:
            secretName: temporal-macos-worker-gateway-tls
            defaultMode: 0440
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-macos-worker-gateway
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal-macos-worker-gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: temporal-macos-worker-gateway
  ports:
    - name: mtls-grpc
      protocol: TCP
      port: 7233
      targetPort: mtls-grpc
      nodePort: 30733
