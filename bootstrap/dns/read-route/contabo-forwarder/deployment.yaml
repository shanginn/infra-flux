apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-pdns-read-forwarder
spec:
  replicas: 2
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: legacy-pdns-read-forwarder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-pdns-read-forwarder
      annotations:
        infra.shanginn.io/private-config-revision: ${LEGACY_DNS_READ_ROUTE_REVISION}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dns
        image: docker.io/coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
        args:
        - -conf
        - /config/Corefile
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        ports:
        - name: dns-tcp
          containerPort: 5353
          protocol: TCP
        - name: dns-udp
          containerPort: 5353
          protocol: UDP
        - name: dns-metrics
          containerPort: 9153
        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 250m
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: legacy-pdns-read-forwarder-config
