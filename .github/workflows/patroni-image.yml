name: Build and test Patroni image

on:
  push:
    branches: [main]
    paths:
      - bootstrap/images/patroni/**
      - .github/workflows/patroni-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: patroni-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/shanginn/infra-flux-patroni
  VERSION: 18.6-4.1.5

jobs:
  build-test-publish:
    if: github.repository == 'shanginn/infra-flux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load the image before publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bootstrap/images/patroni
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/shanginn/infra-flux
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.description=PostgreSQL with Patroni and explicit fencing gates

      - name: Test config, PostgreSQL TLS, basebackup and async streaming
        run: bash bootstrap/images/patroni/test-image.sh "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Log in to GHCR with this repository's token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the exact image that passed the container test
        run: |
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:${VERSION}"
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:sha-${GITHUB_SHA}"
