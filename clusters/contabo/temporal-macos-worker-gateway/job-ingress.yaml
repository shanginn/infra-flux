apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: generach-inswapper-jobs-mtls
  namespace: generach
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-tls-secret: generach/temporal-macos-worker-client-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: optional
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-secret: generach/unified-inswapper-proxy-tls
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-verify-depth: "4"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: inswapper.generach.ru
    nginx.ingress.kubernetes.io/proxy-ssl-protocols: TLSv1.3
    nginx.ingress.kubernetes.io/upstream-vhost: inswapper.generach.ru
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - inswapper.generach.ru
      secretName: generach-inswapper-jobs-tls
  rules:
    - host: inswapper.generach.ru
      http:
        paths:
          - path: /__telegram-bot-webhook/inswapper-jobs
            pathType: Exact
            backend:
              service:
                name: unified-inswapper-handover
                port:
                  number: 443
