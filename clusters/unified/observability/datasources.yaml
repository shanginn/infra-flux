apiVersion: 1
prune: true
datasources:
  - name: Prometheus HA
    uid: prometheus-ha
    type: prometheus
    access: proxy
    url: http://prometheus-query.monitoring.svc.cluster.local:9090
    isDefault: true
    editable: false
    jsonData: {httpMethod: POST, timeInterval: 60s, queryTimeout: 25s, prometheusType: Prometheus, prometheusVersion: 3.15.0}
  - name: Prometheus replica 0
    uid: prometheus-0
    type: prometheus
    access: proxy
    url: http://prometheus-0.prometheus.monitoring.svc.cluster.local:9090
    isDefault: false
    editable: false
    jsonData: {httpMethod: POST, timeInterval: 60s, queryTimeout: 25s, prometheusType: Prometheus, prometheusVersion: 3.15.0}
  - name: Prometheus replica 1
    uid: prometheus-1
    type: prometheus
    access: proxy
    url: http://prometheus-1.prometheus.monitoring.svc.cluster.local:9090
    editable: false
    jsonData: {httpMethod: POST, timeInterval: 60s, queryTimeout: 25s, prometheusType: Prometheus, prometheusVersion: 3.15.0}
  - name: Loki home
    uid: loki-home
    type: loki
    access: proxy
    url: http://loki.logging.svc.cluster.local:3100
    editable: false
    jsonData: {maxLines: 200, timeout: 30}
