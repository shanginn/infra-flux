apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: phenogram-public-edge
spec:
  entryPoints: [websecure]
  routes:
    - match: HostSNI(`api.phenogram.io`) || HostSNI(`app.phenogram.io`) || HostSNI(`phenogram.io`)
      services:
        - name: phenogram-public-edge
          port: 8443
          proxyProtocol: {version: 2}
  tls: {passthrough: true}
