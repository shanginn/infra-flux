apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: itaisolutions
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itaisolutions-static-app-http
  namespace: itaisolutions
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: itaisolutions-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: itaisolutions.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: itaisolutions-static-app
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itaisolutions-static-app
  namespace: itaisolutions
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
  - host: itaisolutions.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: itaisolutions-static-app
            port:
              name: http
  tls:
  - hosts:
    - itaisolutions.ru
    secretName: itaisolutions-tls
