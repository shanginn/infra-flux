apiVersion: v1
kind: Service
metadata:
  name: legacy-pdns-read-forwarder-preview
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: legacy-pdns-read-forwarder
  ports:
  - name: dns-tcp
    port: 53
    protocol: TCP
    targetPort: dns-tcp
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: dns-udp
