# Common to SELECT-only DNS readers and the private API processes.
launch=gpgsql
gpgsql-dbname=powerdns
gpgsql-host=unified-postgres.database.svc
gpgsql-port=5432
include-dir=/etc/powerdns/runtime
local-port=5353
primary=no
secondary=no
autosecondary=no
disable-axfr=yes
allow-axfr-ips=
allow-notify-from=
only-notify=
dnsupdate=no
allow-dnsupdate-from=
expand-alias=no
enable-lua-records=no
security-poll-suffix=
cache-ttl=0
query-cache-ttl=0
negquery-cache-ttl=0
zone-cache-refresh-interval=0
zone-metadata-cache-ttl=0
dnssec-key-cache-ttl=0
receiver-threads=1
distributor-threads=2
max-tcp-connections=100
webserver=yes
webserver-port=8081
webserver-print-arguments=no
webserver-loglevel=none
webserver-max-bodysize=2
webserver-max-concurrent-connections=16
webserver-connection-timeout=3
socket-dir=/run/pdns
daemon=no
guardian=no
write-pid=no
disable-syslog=yes
loglevel=4
log-dns-queries=no
log-dns-details=no
version-string=anonymous
