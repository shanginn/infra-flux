apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Generated from the official Flux v2.9.6 release; upgrades are reviewed in Git.
  - components.yaml
  - sync.yaml
patches:
  - target:
      kind: Deployment
      name: (image-automation-controller|image-reflector-controller|source-watcher)
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: infra.shanginn.io/site
                          operator: In
                          values: [msk, fin]
