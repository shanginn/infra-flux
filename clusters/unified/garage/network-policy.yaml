apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: garage-private-ingress}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: garage, app.kubernetes.io/instance: garage}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: garage, app.kubernetes.io/instance: garage}}
      ports: [{port: 3901, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {infra.shanginn.io/garage-client: 'true'}}
      ports: [{port: 3900, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app: prometheus}}
      ports: [{port: 3903, protocol: TCP}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: garage, app.kubernetes.io/instance: garage}}
      ports: [{port: 3901, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: '${SERVICE_CIDR}'}}]
      ports: [{port: 443, protocol: TCP}]
    - to: [{ipBlock: {cidr: 100.64.0.0/10}}]
      ports: [{port: 6443, protocol: TCP}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: garage}
spec:
  minAvailable: 2
  selector:
    matchLabels: {app.kubernetes.io/name: garage, app.kubernetes.io/instance: garage}
