apiVersion: apps/v1
kind: Deployment
metadata:
  name: phenogram-public-edge
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: phenogram-public-edge}
  template:
    metadata:
      labels: {app.kubernetes.io/name: phenogram-public-edge}
    spec:
      nodeSelector: {kubernetes.io/hostname: fin}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: docker.io/library/nginx@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
          command: [nginx, -g, 'daemon off;']
          ports: [{name: https, containerPort: 8443}, {name: health, containerPort: 8081}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: '1', memory: 512Mi}
          startupProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: api-tls, mountPath: /etc/phenogram-edge/tls/api, readOnly: true}
            - {name: app-tls, mountPath: /etc/phenogram-edge/tls/app, readOnly: true}
            - {name: web-tls, mountPath: /etc/phenogram-edge/tls/web, readOnly: true}
      volumes:
        - name: config
          configMap: {name: phenogram-edge-nginx}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
        - name: cache
          emptyDir: {sizeLimit: 8Gi}
        - name: api-tls
          secret: {secretName: api-phenogram-io-tls, defaultMode: 0440}
        - name: app-tls
          secret: {secretName: app-phenogram-io-tls, defaultMode: 0440}
        - name: web-tls
          secret: {secretName: phenogram-io-tls, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: phenogram-public-edge
spec:
  selector: {app.kubernetes.io/name: phenogram-public-edge}
  ports: [{name: https, port: 8443, targetPort: https}]
