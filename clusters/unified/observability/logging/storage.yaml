apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: unified-logs-local}
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: unified-loki-home}
spec:
  capacity: {storage: 4Gi}
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: unified-logs-local
  local: {path: /var/lib/infra-logging/loki/data}
  claimRef: {namespace: logging, name: loki}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions: [{key: kubernetes.io/hostname, operator: In, values: [home]}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: loki}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: unified-logs-local
  volumeName: unified-loki-home
  resources: {requests: {storage: 4Gi}}
