apiVersion: v1
kind: Service
metadata: {name: loki}
spec:
  selector: {app: loki}
  ports: [{name: http, port: 3100, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki, app.kubernetes.io/name: loki}}
    spec:
      nodeSelector: {kubernetes.io/hostname: home}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: loki
          image: docker.io/grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
          args: [-config.file=/etc/loki/loki.yaml, -target=all]
          ports: [{name: http, containerPort: 3100}]
          resources:
            requests: {cpu: 100m, memory: 512Mi, ephemeral-storage: 16Mi}
            limits: {cpu: '2', memory: 2Gi, ephemeral-storage: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 30}
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: data, mountPath: /loki}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          persistentVolumeClaim: {claimName: loki}
        - name: temporary
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: alloy}
spec:
  selector: {matchLabels: {app: alloy}}
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1}}
  template:
    metadata: {labels: {app: alloy, app.kubernetes.io/name: alloy}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/os: linux}
      tolerations: [{operator: Exists, effect: NoSchedule}]
      terminationGracePeriodSeconds: 30
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
          args: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy, --disable-reporting, /etc/alloy/config.alloy]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports: [{name: metrics, containerPort: 12345}]
          resources:
            requests: {cpu: 25m, memory: 64Mi, ephemeral-storage: 8Mi}
            limits: {cpu: 250m, memory: 192Mi, ephemeral-storage: 32Mi}
          securityContext: {runAsUser: 0, runAsGroup: 0, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /-/ready, port: metrics}, periodSeconds: 15}
          livenessProbe: {httpGet: {path: /-/healthy, port: metrics}, periodSeconds: 30}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy, readOnly: true}
            - {name: logs, mountPath: /var/log/pods, readOnly: true}
            - {name: positions, mountPath: /var/lib/alloy}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: alloy-config}
        - name: logs
          hostPath: {path: /var/log/pods, type: Directory}
        - name: positions
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        - name: temporary
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
