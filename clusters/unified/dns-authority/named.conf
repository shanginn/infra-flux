// The runtime include defines the legacy-bind primaries list.
// Transfer authentication can be added here without copying keys into Git.
include "/run/transfer/named.conf.transfers";

options {
    directory "/var/lib/bind";
    listen-on port 5353 { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-recursion { none; };
    allow-query-cache { none; };
    allow-query { any; };
    allow-transfer { none; };
    allow-update { none; };
    allow-update-forwarding { none; };
    notify no;
    dnssec-validation no;
    minimal-responses yes;
    minimal-any yes;
    max-udp-size 1232;
    edns-udp-size 1232;
    version none;
    hostname none;
    server-id none;
    pid-file "/run/named/named.pid";
    session-keyfile none;
    dump-file "/var/lib/bind/cache_dump.db";
    statistics-file "/var/lib/bind/named.stats";
    memstatistics-file "/var/lib/bind/named.memstats";
    max-cache-size 8M;
    max-journal-size 16M;
    transfers-in 2;
    transfers-per-ns 2;
    serial-query-rate 5;
    // NOTIFY is an optimization; polling bounds change propagation even
    // when the legacy primary cannot send NOTIFY into this pod network.
    min-refresh-time 10;
    max-refresh-time 10;
    min-retry-time 10;
    max-retry-time 10;
    max-transfer-time-in 1;
    max-transfer-idle-in 1;
    zone-statistics yes;
};

// No remotely accessible control channel or statistics endpoint.
controls { };
statistics-channels {
    inet 127.0.0.1 port 8053 allow { 127.0.0.1; };
};

include "/config/named.conf.zones";
