apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: frontend
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
