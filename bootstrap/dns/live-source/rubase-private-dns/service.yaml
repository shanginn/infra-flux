apiVersion: v1
kind: Service
metadata:
  name: vibesites-powerdns-private-dns
  namespace: vibesites-dns
  labels:
    app.kubernetes.io/part-of: vibesites-dns
    app.kubernetes.io/component: private-dns-source
spec:
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  externalIPs:
    - "${RUBASE_VPN_ADDRESS}"
  externalTrafficPolicy: Local
  internalTrafficPolicy: Local
  selector:
    app: powerdns
    app.kubernetes.io/name: powerdns
  ports:
    - name: dns-udp
      port: 5355
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 5355
      targetPort: 53
      protocol: TCP
