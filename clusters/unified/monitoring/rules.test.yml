        values: '1+0x5'
      - series: 'up{job="bind-authority",node="empty"}'
        values: '1+0x5'
      - series: 'bind_zone_serial{job="bind-authority",node="complete",view="public",zone_name="zone1.example",instance="original"}'
        values: '100+0x5'
