apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-edge
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: contabo-app-edge}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: mystaro}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: sistent}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: generach}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 8888}]
