apiVersion: v1
kind: Namespace
metadata:
  name: ingress-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: ingress-system
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: ingress-system
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: 42.0.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    deployment:
      kind: DaemonSet
      healthchecksPort: 8000
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: false
      kubernetesIngress:
        enabled: true
      kubernetesGateway:
        enabled: false
    api:
      dashboard: false
    ingressRoute:
      dashboard:
        enabled: false
    service:
      type: NodePort
      spec:
        externalTrafficPolicy: Local
    ports:
      web:
        port: 8000
        nodePort: 32080
        forwardedHeaders:
          trustedIPs: ['${VPN_CIDR}']
      websecure:
        port: 8443
        nodePort: 32443
        proxyProtocol:
          trustedIPs: ['${VPN_CIDR}']
    additionalArguments:
      - --ping.entrypoint=web
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: '1'
        memory: 256Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: infra.shanginn.io/site
                  operator: In
                  values: [msk, fin]
    log:
      level: WARN
