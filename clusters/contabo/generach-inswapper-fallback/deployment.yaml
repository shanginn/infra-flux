apiVersion: apps/v1
kind: Deployment
metadata:
  name: generach-inswapper-cpu-fallback
  namespace: generach
  labels:
    app.kubernetes.io/name: generach-inswapper-cpu-fallback
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: generach-inswapper-cpu-fallback
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generach-inswapper-cpu-fallback
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: dockerconfigjson-github-com
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inswapper
          image: ghcr.io/shanginn/generach-python:inswapper-cpu-27ddf01f135cfc5c87e83dba29040acc7e6e23c8
          imagePullPolicy: IfNotPresent
          env:
            - name: INSWAPPER_TRANSPORT
              value: redis
            - name: INSWAPPER_ENGINE
              value: inswapper-hq
            - name: INSWAPPER_COMPUTE_UNITS
              value: CPUOnly
            - name: INSWAPPER_CPU_THREADS
              value: "4"
            - name: INSWAPPER_CONCURRENCY
              value: "1"
            - name: INSWAPPER_HQ_CONCURRENCY
              value: "1"
            - name: INSWAPPER_JOB_POLL_INTERVAL_SECONDS
              value: "2"
            - name: INSWAPPER_FALLBACK_MINIMUM_JOB_AGE_SECONDS
              value: "30"
            - name: INSWAPPER_FALLBACK_LEASE_SECONDS
              value: "600"
            - name: INSWAPPER_PRIMARY_HEARTBEAT_SECONDS
              value: "30"
            - name: INSWAPPER_TELEGRAM_RESULT_TRANSPORT
              value: direct
            - name: INSWAPPER_TELEGRAM_STORAGE_CHAT_ID
              value: "-4544761659"
            - name: INSWAPPER_MODELS_DIR
              value: /app/models/inswapper
            - name: INSWAPPER_HQ_MODELS_DIR
              value: /app/models/better_faceswap
            - name: INSWAPPER_CACHE_DIR
              value: /app/cache
            - name: INSWAPPER_READY_FILE
              value: /tmp/inswapper-ready
            - name: REDIS_HOST
              value: redis-master.redis.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DATABASE
              value: "10"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: python-bot-secret
                  key: TELEGRAM_BOT_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: python-bot-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/inswapper-ready
            periodSeconds: 5
            failureThreshold: 240
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/inswapper-ready
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache
              mountPath: /app/cache
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
