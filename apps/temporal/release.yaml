apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
  namespace: temporal
spec:
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: temporal-frontend
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: temporal-frontend
              spec:
                selector:
                  app.kubernetes.io/component: internal-frontend
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: temporal-web
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: temporal-web
              spec:
                template:
                  spec:
                    containers:
                      - name: temporal-web
                        env:
                          - name: TEMPORAL_ADDRESS
                            value: "temporal-authenticated-frontend.temporal.svc:7233"
  chart:
    spec:
      chart: temporal
      version: "0.72.0"
      sourceRef:
        kind: HelmRepository
        name: temporal
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    serviceAccount:
      create: true
      name: "temporal"
    server:
      replicaCount: 1
      image:
        repository: temporalio/server
        tag: "1.29.6.1"
        pullPolicy: IfNotPresent
      internalFrontend:
        enabled: true
      config:
        numHistoryShards: 512
        authorization:
          jwtKeyProvider:
            keySourceURIs:
              - "http://temporal-local-auth.temporal.svc.cluster.local:8080/.well-known/jwks.json"
            refreshInterval: 1m
          permissionsClaimName: permissions
          audience: temporal-rubase
          authorizer: default
          claimMapper: default
        persistence:
          default:
            driver: "sql"
            sql:
              driver: "postgres12"
              host: "main-db-rw.database.svc.cluster.local"
              port: 5432
              database: "temporal"
              user: "temporal_user"
              password: "" # Password managed by secret
              existingSecret: "temporal-db-user"
              maxConns: 5
              maxIdleConns: 2
              maxConnLifetime: "1h"
          visibility:
            driver: "sql"
            sql:
              driver: "postgres12"
              host: "main-db-rw.database.svc.cluster.local"
              port: 5432
              database: "temporal_visibility"
              user: "temporal_user"
              password: "" # Password managed by secret
              existingSecret: "temporal-db-user"
              maxConns: 5
              maxIdleConns: 2
              maxConnLifetime: "1h"
    schema:
      createDatabase:
        enabled: true
      setup:
        enabled: true
      update:
        enabled: true
    admintools:
      enabled: true
      image:
        repository: temporalio/admin-tools
        tag: "1.29.6.1-tctl-1.18.4-cli-1.7.0"
        pullPolicy: IfNotPresent
    web:
      enabled: true
      additionalEnv:
        - name: TEMPORAL_CORS_ORIGINS
          value: "https://temporal.rubase.shanginn.io"
      ingress:
        enabled: false
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-temporal-redirect-https@kubernetescrd
        hosts:
          - "temporal.shanginn.io"
        tls:
          - secretName: temporal-tls
            hosts:
              - "temporal.shanginn.io"
    elasticsearch:
      enabled: false
    prometheus:
      enabled: false
    grafana:
      enabled: false
    cassandra:
      enabled: false
