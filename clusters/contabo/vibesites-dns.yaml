apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vibesites-dns
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/contabo/vibesites-dns
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: legacy-public-dns-route
      optional: false
