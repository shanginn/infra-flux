apiVersion: v1
kind: PersistentVolume
metadata:
  name: telegram-server-home
spec:
  capacity: {storage: 20Gi}
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: unified-apps-local
  local: {path: /var/lib/infra-apps/telegram-server/data}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [home]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telegram-server
  namespace: telegram-server
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: unified-apps-local
  volumeName: telegram-server-home
  resources: {requests: {storage: 20Gi}}
