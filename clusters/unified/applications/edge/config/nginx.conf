worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
  default_type application/octet-stream;
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;
  log_format edge '$proxy_protocol_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
  access_log /dev/stdout edge;
  map_hash_bucket_size 128;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $proxy_protocol_addr;
  proxy_set_header X-Forwarded-For $proxy_protocol_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  proxy_request_buffering on;
  proxy_buffering off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:AppEdgeTLS:10m;
  ssl_session_timeout 10m;

  # Only the dedicated, verified legacy proxy may forward an end user's
  # certificate result. Anonymous/direct callers cannot supply these identities.
  map "$ssl_client_verify:$ssl_client_fingerprint" $legacy_proxy_authenticated {
    default 0;
    include /etc/app-edge/legacy/verified-proxy.map;
  }
  map "$legacy_proxy_authenticated:$http_ssl_client_verify" $edge_client_verify {
    default $ssl_client_verify;
    "1:SUCCESS" SUCCESS;
    "1:NONE" NONE;
    ~^1: "FAILED: legacy proxy client status missing";
  }
  map "$legacy_proxy_authenticated:$http_ssl_client_verify" $edge_client_subject_dn {
    default $ssl_client_s_dn;
    "1:SUCCESS" $http_ssl_client_subject_dn;
    ~^1: "";
  }
  map "$legacy_proxy_authenticated:$http_ssl_client_verify" $edge_client_issuer_dn {
    default $ssl_client_i_dn;
    "1:SUCCESS" $http_ssl_client_issuer_dn;
    ~^1: "";
  }

  server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name mystaro.ru;
    ssl_certificate /etc/app-edge/tls/mystaro/tls.crt;
    ssl_certificate_key /etc/app-edge/tls/mystaro/tls.key;
    client_max_body_size 1m;
    location / { proxy_pass http://mystaro-app.mystaro.svc.cluster.local:80; }
  }

  server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name sistent.ru xn--e1afqnbgc.xn--p1ai;
    ssl_certificate /etc/app-edge/tls/sistent/tls.crt;
    ssl_certificate_key /etc/app-edge/tls/sistent/tls.key;
    client_max_body_size 1040m;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    location / { proxy_pass http://app.sistent.svc.cluster.local:80; }
  }

  server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name generach.ru;
    ssl_certificate /etc/app-edge/tls/generach/tls.crt;
    ssl_certificate_key /etc/app-edge/tls/generach/tls.key;
    client_max_body_size 1m;
    location = /__telegram-bot-webhook { proxy_pass http://python-bot.generach.svc.cluster.local:8888; }
    location /__telegram-bot-webhook/ { proxy_pass http://python-bot.generach.svc.cluster.local:8888; }
    location / { proxy_pass http://api.generach.svc.cluster.local:80; }
  }

  server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name inswapper.generach.ru;
    ssl_certificate /etc/app-edge/tls/inswapper/tls.crt;
    ssl_certificate_key /etc/app-edge/tls/inswapper/tls.key;
    ssl_client_certificate /etc/app-edge/client-ca/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 1;
    client_max_body_size 20m;
    location = /__telegram-bot-webhook/inswapper-jobs {
      # These names and values match the current source ingress behavior.
      proxy_set_header ssl-client-verify $edge_client_verify;
      proxy_set_header ssl-client-subject-dn $edge_client_subject_dn;
      proxy_set_header ssl-client-issuer-dn $edge_client_issuer_dn;
      # A location-level proxy_set_header list replaces its inherited list.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $proxy_protocol_addr;
      proxy_set_header X-Forwarded-For $proxy_protocol_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://python-bot.generach.svc.cluster.local:8888;
    }
    location / { return 404; }
  }
}
