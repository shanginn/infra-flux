apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: app-edge
spec:
  entryPoints: [websecure]
  routes:
    - match: HostSNI(`mystaro.ru`) || HostSNI(`sistent.ru`) || HostSNI(`xn--e1afqnbgc.xn--p1ai`) || HostSNI(`generach.ru`) || HostSNI(`inswapper.generach.ru`)
