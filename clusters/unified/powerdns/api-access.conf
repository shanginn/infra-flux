# DNS is used only for local readiness, never exposed by the API Service.
local-address=127.0.0.1
gpgsql-user=powerdns_api
gpgsql-dnssec=yes
api=yes
webserver-address=0.0.0.0
# Preserve existing cluster access; the bridge admits only measured /32 sources.
# NetworkPolicy and the entry VPN ACL remain separate restrictions.
webserver-allow-from=127.0.0.1,10.0.0.0/8,${MSK_API_LOCAL_SOURCE_CIDR},${MSK_API_REMOTE_SOURCE_CIDR},${FIN_API_LOCAL_SOURCE_CIDR},${FIN_API_REMOTE_SOURCE_CIDR}
