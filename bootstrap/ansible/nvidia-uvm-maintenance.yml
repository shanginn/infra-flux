---
# Independent boot preparation for the existing CUDA worker. This play only
# installs/enables a new oneshot; it does not start it or restart the worker.
# nvidia-modprobe -u creates UVM device nodes as well as loading the module:
# https://github.com/NVIDIA/nvidia-modprobe/blob/main/nvidia-modprobe.1.m4
# A modules-load entry alone does not ensure those device nodes exist.
# Supply reviewed machine ID, cluster CA and worker-unit SHA in private vars.
# Before orders boot preparation; failure does not prevent the existing worker
# from starting. Verify both unit success and actual CUDA after a reviewed boot.
- name: Prepare NVIDIA UVM before the existing home CUDA worker at next boot
  hosts: home
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    unified_prepare_nvidia_uvm: false
    nvidia_expected_driver_version: "580.178.04"
    nvidia_uvm_boot_unit: |
      # Managed by infra-flux/ansible/nvidia-uvm-maintenance
      [Unit]
      Description=Prepare NVIDIA Unified Memory devices for the CUDA worker
      After=systemd-modules-load.service
      Before=generach-inswapper.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/nvidia-modprobe -u -c 0
      ExecStart=/usr/bin/test -c /dev/nvidia-uvm
      RemainAfterExit=yes
      TimeoutStartSec=20

      [Install]
      WantedBy=multi-user.target
  tasks:
    - name: Keep boot configuration unchanged without an explicit opt-in
      ansible.builtin.meta: end_play
      when: not unified_prepare_nvidia_uvm | bool

    - name: Require privately reviewed host and worker identities
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - ansible_play_hosts_all == ['home']
          - nvidia_expected_machine_id is defined
          - nvidia_expected_machine_id is match('^[0-9a-f]{32}$')
          - nvidia_expected_ca_sha256 is defined
          - nvidia_expected_ca_sha256 is match('^[0-9a-f]{64}$')
          - nvidia_expected_worker_unit_sha256 is defined
          - nvidia_expected_worker_unit_sha256 is match('^[0-9a-f]{64}$')
          - nvidia_expected_driver_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')

    - name: Inspect the owned host, reviewed driver and currently active worker
      ansible.builtin.command: &inspect_nvidia_uvm
        argv:
          - /usr/bin/python3
          - -c
          - |
            import hashlib,json,pathlib,stat,subprocess,sys
            machine,ca_expected,worker_expected,driver_expected,unit_content=sys.argv[1:]
            def read(path):
                p=pathlib.Path(path);s=p.lstat()
                assert stat.S_ISREG(s.st_mode) and s.st_uid==0 and not s.st_mode&0o022, 'Untrusted file: '+path
                return p.read_bytes()
            def run(args):
                return subprocess.run(args,check=True,text=True,capture_output=True,timeout=15).stdout.strip()
            def unit(name):
                fields='LoadState,ActiveState,SubState,UnitFileState,FragmentPath,DropInPaths,NeedDaemonReload,User,Group,MainPID,NoNewPrivileges,PrivateDevices'
                return dict(line.split('=',1) for line in run(['systemctl','show',name,'--property='+fields]).splitlines())
            assert read('/etc/machine-id').decode().strip()==machine, 'Wrong physical host'
            phase=json.loads(read('/etc/infra-flux/phase1.json'))
            assert phase['managed_by']=='infra-flux/ansible/phase1', 'Unknown host preparation owner'
            marker=json.loads(read('/etc/infra-flux/kubeadm-state.json'))
            assert marker['managed_by']=='infra-flux/ansible/kubeadm' and marker['cluster_name']=='unified' and marker['node_name']=='home', 'Wrong cluster/node owner'
            ca=hashlib.sha256(read('/etc/kubernetes/pki/ca.crt')).hexdigest()
            assert ca==marker['ca_sha256']==ca_expected, 'Cluster CA changed'
            assert pathlib.Path('/sys/module/nvidia/version').read_text().strip()==driver_expected, 'Kernel driver changed'
            assert pathlib.Path('/sys/module/nvidia_uvm').is_dir(), 'UVM is not currently loaded; diagnose before adoption'
            assert stat.S_ISCHR(pathlib.Path('/dev/nvidia-uvm').lstat().st_mode), 'UVM device missing'
            versions=run(['nvidia-smi','--query-gpu=driver_version','--format=csv,noheader']).splitlines()
            assert versions and set(versions)=={driver_expected}, 'GPU/kernel driver mismatch'
            assert run(['dpkg-query','-W','-f=${Status} ${Version}','nvidia-modprobe'])=='install ok installed '+driver_expected+'-1', 'Unreviewed nvidia-modprobe package'
            sums=[line.split() for line in read('/var/lib/dpkg/info/nvidia-modprobe.md5sums').decode().splitlines()]
            rows=[row for row in sums if len(row)==2 and row[1]=='usr/bin/nvidia-modprobe']
            assert len(rows)==1 and hashlib.md5(read('/usr/bin/nvidia-modprobe')).hexdigest()==rows[0][0], 'Modified nvidia-modprobe binary'
            worker=unit('generach-inswapper.service')
            assert worker['LoadState']=='loaded' and worker['ActiveState']=='active' and worker['SubState']=='running' and worker['UnitFileState']=='enabled', 'Existing worker is not healthy/enabled'
            assert worker['User']==worker['Group']=='generach-inswapper', 'Worker user/group changed'
            assert worker['FragmentPath']=='/etc/systemd/system/generach-inswapper.service' and not worker['DropInPaths'] and worker['NeedDaemonReload']=='no', 'Unexpected worker unit overrides'
            assert worker['NoNewPrivileges']=='yes' and worker['PrivateDevices']=='no', 'Worker sandbox changed'
            digest=hashlib.sha256(read(worker['FragmentPath'])).hexdigest()
            assert digest==worker_expected, 'Worker unit differs from the reviewed baseline'
            pid=int(worker['MainPID']);assert pid>0
            proc=pathlib.Path('/proc')/str(pid)
            process={'pid':pid,'start_ticks':(proc/'stat').read_text().rsplit(')',1)[1].split()[19]}
            target=pathlib.Path('/etc/systemd/system/infra-nvidia-uvm.service')
            if target.exists() or target.is_symlink():
                assert read(str(target)).decode()==unit_content, 'Refuse to replace another boot-preparation unit'
                prepared=unit(target.name)
                assert not prepared['DropInPaths'] and prepared['FragmentPath']==str(target), 'Boot-preparation overrides found'
            else:
                prepared=unit(target.name)
                assert prepared['LoadState']=='not-found' and not prepared['DropInPaths'], 'Boot-preparation unit already exists elsewhere'
            print(json.dumps({'driver':driver_expected,'worker_unit_sha256':digest,'worker_process':process}))
          - "{{ nvidia_expected_machine_id }}"
          - "{{ nvidia_expected_ca_sha256 }}"
          - "{{ nvidia_expected_worker_unit_sha256 }}"
          - "{{ nvidia_expected_driver_version }}"
          - "{{ nvidia_uvm_boot_unit }}"
      changed_when: false
      register: nvidia_before

    - name: Install separate boot preparation without editing the worker
      ansible.builtin.copy:
        dest: /etc/systemd/system/infra-nvidia-uvm.service
        owner: root
        group: root
        mode: "0644"
        content: "{{ nvidia_uvm_boot_unit }}"

    - name: Enable boot preparation without starting or restarting services
      ansible.builtin.systemd_service:
        name: infra-nvidia-uvm.service
        enabled: true
        daemon_reload: true

    - name: Recheck driver, worker sandbox and the same running process
      ansible.builtin.command: *inspect_nvidia_uvm
      changed_when: false
      register: nvidia_after

    - name: Verify the existing worker was left running unchanged
      ansible.builtin.assert:
        that:
          - (nvidia_after.stdout | from_json) == (nvidia_before.stdout | from_json)

    - name: Read back boot enablement
      ansible.builtin.command:
        argv: [systemctl, is-enabled, infra-nvidia-uvm.service]
      changed_when: false
      register: nvidia_boot_enabled
      failed_when: nvidia_boot_enabled.rc != 0 or nvidia_boot_enabled.stdout != 'enabled'
