apiVersion: v1
kind: Service
metadata:
  name: legacy-pdns-api-proxy-preview
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: legacy-pdns-api-proxy}
  ports:
    - {name: http-api, port: 8081, targetPort: http-api, protocol: TCP}
    - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
    - {name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP}
