# Activation template only: not included in any parent Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: legacy-powerdns-writer-egress
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  retryInterval: 1m
  timeout: 2m
  path: ./clusters/rubase/vibesites-dns/legacy-writer-egress
  prune: true
  dependsOn:
    - name: vibesites-dns
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: legacy-dns-network
        optional: false
