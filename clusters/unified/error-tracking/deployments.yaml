          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
