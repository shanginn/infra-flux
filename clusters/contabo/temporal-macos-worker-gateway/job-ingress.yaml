apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: generach-inswapper-jobs-mtls
  namespace: generach
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: temporal/temporal-macos-worker-gateway-tls
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
spec:
  ingressClassName: nginx
  rules:
    - host: generach.ru
      http:
        paths:
          - path: /__telegram-bot-webhook/inswapper-jobs
            pathType: Exact
            backend:
              service:
                name: python-bot
                port:
                  name: webhook
