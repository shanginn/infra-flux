apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal-macos-worker-gateway
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 2m0s
  wait: true
  path: ./clusters/contabo/temporal-macos-worker-gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: temporal-macos-worker-gateway
      namespace: temporal
