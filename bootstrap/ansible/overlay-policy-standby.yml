---
# Run with --limit msk and -e overlay_policy_standby_input_file=/private/operation.json.
# JSON keys: node, active_host, cluster_uid, ca_sha256,
# expected_standby_policy_sha256, active_operation_id, helper_sha256.
# Copies one confirmed policy; never installs helpers or starts/reloads a service.
- name: Mirror the confirmed coordinator policy to its inactive standby
  hosts: unified
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    overlay_policy_standby_script: |
      import base64,fcntl,hashlib,json,os,pathlib,stat,sys,types

      def main():
        request=json.load(sys.stdin); p=request['operation']; mode=request['mode']
        if os.geteuid()!=0 or mode not in ('source','standby'):
          raise ValueError('Invalid execution context')
        helper=pathlib.Path('/etc/infra-flux/overlay-maintenance.py')
        hs=helper.lstat(); parent=helper.parent.lstat()
        if not (stat.S_ISREG(hs.st_mode) and hs.st_uid==0 and not hs.st_mode & 0o077
                and stat.S_ISDIR(parent.st_mode) and parent.st_uid==0 and not parent.st_mode & 0o022):
          raise ValueError('Untrusted installed helper')
        code=helper.read_bytes()
        if hashlib.sha256(code).hexdigest()!=p['helper_sha256']:
          raise ValueError('Installed helper differs from reviewed source')
        m=types.ModuleType('confirmed_policy_mirror')
        exec(compile(code,str(helper),'exec'),m.__dict__)
        root=m.ROOT.lstat()
        m.require(stat.S_ISDIR(root.st_mode) and root.st_uid==0 and not root.st_mode & 0o077,
                  'Untrusted maintenance directory')
        fd=os.open(m.ROOT/'lock',os.O_RDONLY|os.O_NOFOLLOW)
        with os.fdopen(fd,'rb') as lock:
          ls=os.fstat(lock.fileno())
          m.require(stat.S_ISREG(ls.st_mode) and ls.st_uid==0 and not ls.st_mode & 0o077,
                    'Untrusted maintenance lock')
          fcntl.flock(lock,fcntl.LOCK_EX)
          node=p['active_host'] if mode=='source' else p['node']
          overlay=m.identity({'node':node,'cluster_uid':p['cluster_uid'],'ca_sha256':p['ca_sha256']})
          for path in m.ROOT.glob('*.json'):
            m.require(m.load(path.stem)['phase'] in ('confirmed','rolled-back'),
                      'An overlay operation remains unresolved')
          fence=m.OVERLAY/'active-coordinator'
          if mode=='source':
            m.require(overlay['coordinator'] is True,'Source is not the active coordinator')
            m.trusted(fence)
            record=m.load(p['active_operation_id'])
            m.require(record['kind']=='policy' and record['phase']=='confirmed'
                      and record['node']==node and record['cluster_uid']==p['cluster_uid']
                      and record['ca_sha256']==p['ca_sha256'],'Confirmed source operation differs')
            timer='infra-overlay-rollback-'+record['id']+'.timer'
            m.require(m.command(['systemctl','show',timer,'--property=ActiveState','--value']).strip()==b'inactive',
                      'Source rollback timer is not inactive')
            m.require(m.service('policy')==record['service'],'Active coordinator service identity differs')
            core=m.health(node)
            m.require(m.hs_nodes()==record['vpn_nodes']
                      and sorted(ip for n in record['vpn_nodes'] for ip in n['ips'])==core,
                      'Core VPN identity differs from confirmed policy')
            policy=m.trusted(m.PATHS['policy'])
            m.require(0<len(policy)<=65536 and m.sha(policy)==record['after_sha256']
                      and policy==base64.b64decode(record['after'],validate=True),
                      'Active policy differs from confirmed operation')
            m.policy_shape(json.loads(policy),core)
            m.require(m.service('policy')==record['service'],'Source changed during verification')
            return {'active_host':node,'cluster_uid':p['cluster_uid'],'ca_sha256':p['ca_sha256'],
                    'operation':record['id'],'policy_sha256':record['after_sha256']}

          def inactive():
            m.require(overlay['coordinator'] is False and not os.path.lexists(fence),
                      'Standby has an activation fence or active role')
            raw=m.command(['systemctl','show','infra-headscale.service',
                          '--property=ActiveState,MainPID,UnitFileState,FragmentPath'])
            service=dict(line.split('=',1) for line in raw.decode().splitlines())
            m.require(service=={'ActiveState':'inactive','MainPID':'0','UnitFileState':'disabled',
                                'FragmentPath':'/etc/systemd/system/infra-headscale.service'},
                      'Standby coordinator must remain inactive and disabled')
            m.trusted(pathlib.Path(service['FragmentPath']))
            return service

          before_service=inactive()
          source=request['source']
          m.require(source['active_host']==p['active_host'] and source['operation']==p['active_operation_id']
                    and source['cluster_uid']==p['cluster_uid'] and source['ca_sha256']==p['ca_sha256'],
                    'Source proof identity differs')
          policy=base64.b64decode(request['policy_b64'],validate=True)
          m.require(0<len(policy)<=65536 and m.sha(policy)==source['policy_sha256'],
                    'Transferred policy differs from confirmed source')
          before=m.trusted(m.PATHS['policy'])
          m.require(m.sha(before)==p['expected_standby_policy_sha256'],'Standby policy preimage differs')
          # Recheck the fenced service immediately before the only persistent write.
          m.require(inactive()==before_service,'Standby state changed before replacement')
          changed=before!=policy
          if changed:
            m.atomic(m.PATHS['policy'],policy,0o644)
          current=m.PATHS['policy'].lstat()
          m.require(m.trusted(m.PATHS['policy'])==policy and current.st_uid==0 and current.st_gid==0
                    and stat.S_IMODE(current.st_mode)==0o644,'Standby policy readback differs')
          m.require(inactive()==before_service,'Standby state changed after replacement')
          return {'changed':changed,'node':node,'source_operation':p['active_operation_id'],
                  'policy_sha256':m.sha(policy),'headscale_active':False,'service_reloaded':False}

      try:
        print(json.dumps(main()))
      except Exception as error:
        print(json.dumps({'ok':False,'error_type':type(error).__name__,
                          'message':'Policy mirror stopped; inspect privately before retrying.'}))
        sys.exit(1)

  tasks:
    - name: Require the exact standby target and explicit private operation file
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - ansible_play_hosts_all == ['msk']
          - inventory_hostname == 'msk'
          - overlay_policy_standby_input_file is defined

    - name: Validate private input permissions and the complete operation contract
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json,os,re,stat,sys,uuid
            fd=os.open(sys.argv[1],os.O_RDONLY|os.O_NOFOLLOW)
            with os.fdopen(fd,'rb') as f:
              s=os.fstat(f.fileno())
              assert stat.S_ISREG(s.st_mode) and s.st_uid==os.geteuid() and s.st_nlink==1
              assert not s.st_mode & 0o077 and s.st_size<=16384
              raw=f.read(16385); assert len(raw)<=16384
            def unique(pairs):
              result={}
              for key,value in pairs:
                assert key not in result
                result[key]=value
              return result
            p=json.loads(raw,object_pairs_hook=unique)
            assert set(p)=={'node','active_host','cluster_uid','ca_sha256',
                            'expected_standby_policy_sha256','active_operation_id','helper_sha256'}
            assert p['node']=='msk' and p['active_host']=='fin'
            assert str(uuid.UUID(p['cluster_uid']))==p['cluster_uid']
            assert re.fullmatch('[0-9a-f]{32}',p['active_operation_id'])
            for key in ('ca_sha256','expected_standby_policy_sha256','helper_sha256'):
              assert re.fullmatch('[0-9a-f]{64}',p[key])
            print(json.dumps(p))
          - '{{ overlay_policy_standby_input_file }}'
      delegate_to: localhost
      become: false
      register: overlay_standby_private
      changed_when: false
      no_log: true

    - name: Keep the validated private operation only in memory
      ansible.builtin.set_fact:
        overlay_standby_operation: '{{ overlay_standby_private.stdout | from_json }}'
        cacheable: false
      no_log: true

    - name: Verify the confirmed policy and active coordinator identity
      ansible.builtin.command:
        argv: [python3, -c, '{{ overlay_policy_standby_script }}']
        stdin: "{{ {'mode':'source','operation':overlay_standby_operation} | to_json }}"
      delegate_to: '{{ overlay_standby_operation.active_host }}'
      register: overlay_standby_source
      changed_when: false
      no_log: true

    - name: Read the exact confirmed active policy through the trusted SSH connection
      ansible.builtin.slurp:
        src: /etc/infra-overlay/policy.json
      delegate_to: '{{ overlay_standby_operation.active_host }}'
      register: overlay_standby_policy
      no_log: true

    - name: Atomically mirror the checked bytes while keeping the standby inactive
      ansible.builtin.command:
        argv: [python3, -c, '{{ overlay_policy_standby_script }}']
        stdin: >-
          {{ {'mode':'standby','operation':overlay_standby_operation,
              'source':overlay_standby_source.stdout | from_json,
              'policy_b64':overlay_standby_policy.content} | to_json }}
      register: overlay_standby_result
      changed_when: overlay_standby_result.rc == 0 and (overlay_standby_result.stdout | from_json).changed
      no_log: true

    - name: Report the policy hash and inactive service state
      ansible.builtin.debug:
        msg: '{{ overlay_standby_result.stdout | from_json }}'
