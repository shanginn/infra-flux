apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: patroni-isolation
  namespace: database
spec:
  podSelector:
    matchLabels: &id001
      app.kubernetes.io/name: patroni
      cluster-name: unified-postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - &id002
      podSelector:
        matchLabels: *id001
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8008
  - from:
    - namespaceSelector:
        matchLabels:
          infra.shanginn.io/postgresql-client: 'true'
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8008
  egress:
  - to:
    - *id002
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8008
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: ${VPN_CIDR}
    ports:
    - protocol: TCP
      port: 6443
  - to:
    - ipBlock:
        cidr: ${SERVICE_CIDR}
    ports:
    - protocol: TCP
      port: 443
