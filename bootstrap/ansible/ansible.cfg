[defaults]
home = /tmp/infra-flux-ansible
inventory = inventory.yml
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
local_tmp = /tmp/infra-flux-ansible/tmp

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
pipelining = True
control_path_dir = /tmp/infra-flux-ansible/cp
