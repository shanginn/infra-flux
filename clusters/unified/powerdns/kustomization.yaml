apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Do not add a global namespace: the local PostgreSQL Services belong to database.
resources:
  - namespace.yaml
  - services.yaml
  - workloads.yaml
  - network-policy.yaml
  - pdb.yaml
  - legacy-bridge
configMapGenerator:
  - name: powerdns-config
    namespace: dns-powerdns
    files: [pdns.conf, reader.conf, api.conf, runtime.py]
  # Keep the reader ConfigMap and its hash stable when API access changes.
  - name: powerdns-api-config
    namespace: dns-powerdns
    files: [pdns.conf, api.conf=api-access.conf, runtime.py]
