apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-web
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: glitchtip
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glitchtip
        app.kubernetes.io/component: web
      annotations:
        infra.shanginn.io/config-revision: 6.2.6-2
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 5000
        runAsGroup: 5000
        fsGroup: 5000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: infra.shanginn.io/site
                operator: In
                values:
                - msk
                - fin
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: glitchtip
                app.kubernetes.io/component: web
            topologyKey: kubernetes.io/hostname
      volumes:
      - name: operations
        configMap:
          name: glitchtip-operations
      - name: postgres-ca
        secret:
          secretName: glitchtip-runtime
          defaultMode: 292
          items:
          - key: ca.crt
            path: ca.crt
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: uploads
        emptyDir:
          sizeLimit: 128Mi
      initContainers:
      - name: schema-ready
        image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: glitchtip-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: DATABASE_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: SECRET_KEY
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_STORAGE_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: AWS_STORAGE_BUCKET_NAME
        - name: AWS_S3_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: AWS_S3_ENDPOINT_URL
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: DATABASE_POOL_MAX_SIZE
          value: '2'
        volumeMounts:
        - name: operations
          mountPath: /opt/infra
          readOnly: true
        - name: postgres-ca
          mountPath: /etc/postgresql
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: uploads
          mountPath: /code/uploads
        command:
        - python
        - /opt/infra/schema_ready.py
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
      containers:
      - name: glitchtip
        image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: glitchtip-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: DATABASE_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: SECRET_KEY
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_STORAGE_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: AWS_STORAGE_BUCKET_NAME
        - name: AWS_S3_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: glitchtip-runtime
              key: AWS_S3_ENDPOINT_URL
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        volumeMounts:
        - name: operations
          mountPath: /opt/infra
          readOnly: true
        - name: postgres-ca
          mountPath: /etc/postgresql
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: uploads
          mountPath: /code/uploads
        command:
        - ./bin/run-web.sh
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: '1'
            memory: 768Mi
            ephemeral-storage: 512Mi
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /_health/
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /_health/
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: glitchtip-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glitchtip
      app.kubernetes.io/component: web
---
