apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: unified-garage-data
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: garage-data-home
spec:
  capacity:
    storage: 30Gi
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: unified-garage-data
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /var/lib/infra-garage/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - home
---
