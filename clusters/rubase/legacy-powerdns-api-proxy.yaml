# Bootstrap only this dedicated preview after private substitutions and identity checks.
# Existing writer and public DNS Services retain their current selectors.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: legacy-powerdns-api-proxy
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  path: ./clusters/rubase/vibesites-dns/legacy-api-proxy
  prune: true
  wait: true
  dependsOn:
    - name: vibesites-dns
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: legacy-dns-network
        optional: false
      - kind: ConfigMap
        name: legacy-dns-proxy
        optional: false
