---
# Explicit maintenance, separate from the immutable bootstrap fingerprint.
- name: Inspect kubelet serving TLS prerequisites and all three control planes without changing files
  hosts: control_plane
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars: &kubelet_serving_tls_defaults
    kubelet_serving_tls_apply: false
    kubelet_serving_tls_install_prerequisites: false
    kubelet_serving_tls_expected_config_sha256: {}
    kubelet_serving_tls_expected_identity: {}
  tasks:
    - name: Require the complete control plane and explicit apply outside check mode
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | sort == ['fin', 'home', 'msk']
          - groups['control_plane'] | sort == ansible_play_hosts_all | sort
          - not kubelet_serving_tls_apply | bool or not ansible_check_mode
          - not kubelet_serving_tls_install_prerequisites | bool or not ansible_check_mode

    - name: Check owned Debian node before optional Python package preparation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import hashlib,json,pathlib,stat,sys
            path=pathlib.Path('/etc/infra-flux/kubeadm-state.json');st=path.lstat()
            assert stat.S_ISREG(st.st_mode) and st.st_uid==0 and not st.st_mode & 0o077
            marker=json.loads(path.read_text())
            assert marker['managed_by']=='infra-flux/ansible/kubeadm' and marker['cluster_name']=='unified'
            assert marker['node_name']==sys.argv[1]
            assert marker['ca_sha256']==hashlib.sha256(pathlib.Path('/etc/kubernetes/pki/ca.crt').read_bytes()).hexdigest()
            release=dict(line.split('=',1) for line in pathlib.Path('/etc/os-release').read_text().splitlines() if '=' in line)
            assert release['ID'].strip('"')=='debian' and release['VERSION_ID'].strip('"')=='13'
          - "{{ inventory_hostname }}"
      changed_when: false
      when: kubelet_serving_tls_install_prerequisites | bool

    - name: Install only missing Python TLS inspection dependencies without upgrades or service starts
      ansible.builtin.apt:
        name: [python3-yaml, python3-cryptography]
        state: present
        update_cache: false
        install_recommends: false
        policy_rc_d: 101
      when: kubelet_serving_tls_install_prerequisites | bool

    - name: Inspect the exact kubeconfig preimage, authenticated proxy and cluster health
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/kubelet-serving-tls.py', rstrip=False) }}"
          - inspect
          - --node
          - "{{ inventory_hostname }}"
          - --endpoint-source
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/kubelet-endpoint-maintenance.py', rstrip=False) }}"
          - --shared-source
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/etcd-probe-maintenance.py', rstrip=False) }}"
      check_mode: false
      changed_when: false
      register: kubelet_serving_tls_inspection

    - name: Retain reviewed identity for serial maintenance
      ansible.builtin.set_fact:
        kubelet_serving_tls_identity: "{{ kubelet_serving_tls_inspection.stdout | from_json }}"

    - name: Require one common cluster CA
      ansible.builtin.assert:
        that:
          - groups['control_plane'] | map('extract', hostvars, 'kubelet_serving_tls_identity') | map(attribute='ca_sha256') | unique | list | length == 1

    - name: Show the expected serving identity and exact preimage hashes
      ansible.builtin.debug:
        var: kubelet_serving_tls_identity

- name: Enable verified serving TLS one healthy node at a time
  hosts: control_plane
  order: sorted
  serial: 1
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars: *kubelet_serving_tls_defaults
  tasks:
    - name: Default to inspection only
      ansible.builtin.meta: end_host
      when: not kubelet_serving_tls_apply | bool

    - name: Require explicitly reviewed kubeconfig hashes for all three nodes
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - kubelet_serving_tls_expected_config_sha256.keys() | list | sort == ['fin', 'home', 'msk']
          - kubelet_serving_tls_expected_config_sha256[inventory_hostname] is match('^[0-9a-f]{64}$')
          - kubelet_serving_tls_expected_identity.keys() | list | sort == ['fin', 'home', 'msk']

    - name: Change only serverTLSBootstrap, restart once, approve the owned CSR and verify real TLS
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/kubelet-serving-tls.py', rstrip=False) }}"
          - apply
          - --node
          - "{{ inventory_hostname }}"
          - --ca-sha256
          - "{{ kubelet_serving_tls_identity.ca_sha256 }}"
          - --expected-sha256
          - "{{ kubelet_serving_tls_expected_config_sha256[inventory_hostname] }}"
          - --review-json
          - "{{ kubelet_serving_tls_expected_identity[inventory_hostname] | to_json }}"
          - --endpoint-source
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/kubelet-endpoint-maintenance.py', rstrip=False) }}"
          - --shared-source
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/etcd-probe-maintenance.py', rstrip=False) }}"
      register: kubelet_serving_tls_result
      changed_when: (kubelet_serving_tls_result.stdout | from_json).changed

    - name: Show stable recovery proof
      ansible.builtin.debug:
        msg: "{{ kubelet_serving_tls_result.stdout | from_json }}"
