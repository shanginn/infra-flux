apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: logging-private}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app: prometheus}}
      ports: [{port: 3100, protocol: TCP}, {port: 12345, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: loki-readers-writers}
spec:
  podSelector: {matchLabels: {app: loki}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: alloy}}}]
      ports: [{port: 3100, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app: grafana}}
      ports: [{port: 3100, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: alloy-writer}
spec:
  podSelector: {matchLabels: {app: alloy}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: loki}}}]
      ports: [{port: 3100, protocol: TCP}]
