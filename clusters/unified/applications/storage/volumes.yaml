apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: unified-apps-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sistent-uploads-home
spec:
  capacity: {storage: 20Gi}
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: unified-apps-local
  local: {path: /var/lib/infra-apps/sistent/uploads}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [home]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-uploads
  namespace: sistent
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: unified-apps-local
  volumeName: sistent-uploads-home
  resources: {requests: {storage: 20Gi}}
---
