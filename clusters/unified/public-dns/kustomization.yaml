apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: public-dns
components:
  - ../../../bootstrap/dns/public-dns-per-site
resources:
  - namespace.yaml
  - rbac.yaml
  - monitoring-rbac.yaml
  - daemonset.yaml
  - network-policy.yaml
configMapGenerator:
  # Pin the deployed name: CoreDNS reloads this volume without a pod restart.
  - name: public-dns-config-8kb7hccgc2
    files: [Corefile, settings.json, controller.py]
    options:
      disableNameSuffixHash: true
  - name: public-dns-zone
    files: [state.json]
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
        kustomize.toolkit.fluxcd.io/prune: Disabled
