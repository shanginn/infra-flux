apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: infra-flux
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/shanginn/infra-flux.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unified
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/unified
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-flux
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: unified-network
        optional: false
      - kind: ConfigMap
        name: unified-legacy-dns
        optional: false
      - kind: ConfigMap
        name: unified-legacy-powerdns-source
        optional: false
