apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-meilisearch-backfill-dry-run-v2
  namespace: temporal
  annotations:
    temporal.shanginn.io/image-oci-index: sha256:948e10a83115ff80f0cb5def325603d200dad9e29d59c56fab0896f20fe5eae0
  labels:
    app.kubernetes.io/name: temporal-meilisearch-backfill
    app.kubernetes.io/instance: temporal
    app.kubernetes.io/part-of: temporal
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-meilisearch-backfill
        app.kubernetes.io/instance: temporal
        app.kubernetes.io/part-of: temporal
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backfill
          image: rubase.local/temporal-meilisearch:rubase-v1.29.6.1-ac66573
          imagePullPolicy: Never
          command:
            - /bin/bash
            - -ec
          args:
            - |
              set -o pipefail
              mkdir -p /work/config
              /usr/local/bin/dockerize \
                -template /input/config_template.yaml:/work/config/docker.yaml
              exec /usr/local/bin/temporal-server \
                --root /work \
                --config config \
                --env docker \
                backfill-sql-visibility \
                --target-store meilisearch-visibility \
                --source-host main-db-rw.database.svc.cluster.local \
                --source-port 5432 \
                --source-database temporal_visibility \
                --source-user temporal_user \
                --source-password-env TEMPORAL_VISIBILITY_STORE_PASSWORD \
                --source-sslmode disable \
                --batch-size 500 \
                --dry-run
          env:
            - name: TEMPORAL_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-db-user
                  key: password
            - name: TEMPORAL_VISIBILITY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-db-user
                  key: password
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: meilisearch
                  key: master-key
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /input
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: config
          configMap:
            name: temporal-meilisearch-config
        - name: work
          emptyDir:
            sizeLimit: 16Mi
