apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus-garage-discovery}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus-garage-discovery}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-garage-discovery}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: monitoring}
