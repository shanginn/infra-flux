[server]
http_port = 3000
root_url = https://grafana.apps.shanginn.io
domain = grafana.apps.shanginn.io
enforce_domain = true
read_timeout = 30
[database]
type = postgres
host = unified-postgres.database.svc:5432
name = grafana
ssl_mode = verify-full
ca_cert_path = /etc/postgresql/ca.crt
max_open_conn = 3
max_idle_conn = 1
conn_max_lifetime = 300
migration_locking = true
locking_attempt_timeout_sec = 60
log_queries = false
[security]
allow_embedding = false
cookie_secure = true
cookie_samesite = strict
disable_gravatar = true
strict_transport_security = true
strict_transport_security_max_age_seconds = 31536000
content_security_policy = true
[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org_role = Viewer
[auth.anonymous]
enabled = false
[auth.basic]
enabled = true
[auth]
disable_login_form = false
login_maximum_inactive_lifetime_duration = 12h
login_maximum_lifetime_duration = 7d
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[plugins]
preinstall_disabled = true
public_key_retrieval_disabled = true
[log]
mode = console
level = warn
[metrics]
# UI ingress must not publish unauthenticated process metrics.
enabled = false
[unified_alerting]
enabled = false
[live]
max_connections = 0
[dataproxy]
timeout = 30
max_conns_per_host = 8
[dashboard]
min_refresh_interval = 1m
