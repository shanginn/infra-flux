apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: public-dns
spec:
  selector:
    matchLabels: {app: public-dns}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
  minReadySeconds: 5
  template:
    metadata:
      labels: {app: public-dns}
    spec:
      serviceAccountName: public-dns
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: infra.shanginn.io/site
                    operator: In
                    values: [msk, fin]
      initContainers:
        - name: seed-zone
          image: docker.io/library/python:3.14.6-slim-trixie@sha256:7bec7ddcddeff7975d6ba9b4be7dd6f6b2f55e7491539145e2978f7f97ce9144
          command: [python3, -B, /config/controller.py, init]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: seed, mountPath: /seed, readOnly: true}
            - {name: zone, mountPath: /zones}
      containers:
        - name: coredns
          image: docker.io/coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
          args: [-conf, /config/Corefile]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          ports:
            - {name: dns-udp, containerPort: 53, hostPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, hostPort: 53, protocol: TCP}
            - {name: dns-metrics, containerPort: 9153}
          readinessProbe:
            httpGet: {path: /ready, port: 8181}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: zone, mountPath: /zones, readOnly: true}
        - name: publisher
          image: docker.io/library/python:3.14.6-slim-trixie@sha256:7bec7ddcddeff7975d6ba9b4be7dd6f6b2f55e7491539145e2978f7f97ce9144
          command: [python3, -B, /config/controller.py]
          env:
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: agent-metrics, containerPort: 9080}
          livenessProbe:
            httpGet: {path: /health, port: 9080}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 15m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: zone, mountPath: /zones}
            - {name: api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
      volumes:
        - name: config
          configMap: {name: public-dns-config}
        - name: seed
          configMap: {name: public-dns-zone}
        - name: zone
          emptyDir: {sizeLimit: 1Mi}
        - name: api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
