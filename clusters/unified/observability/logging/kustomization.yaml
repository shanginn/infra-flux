apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logging
resources: [namespace.yaml, storage.yaml, workloads.yaml, network-policy.yaml, monitoring-rbac.yaml]
configMapGenerator:
  - name: loki-config
    files: [loki.yaml]
  - name: alloy-config
    files: [config.alloy]
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
