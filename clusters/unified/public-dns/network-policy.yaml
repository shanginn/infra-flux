apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-dns
spec:
  podSelector:
    matchLabels: {app: public-dns}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {port: 9153, protocol: TCP}
        - {port: 9080, protocol: TCP}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: dns-authority}}
          podSelector: {matchLabels: {app: bind-authority}}
      ports:
        - {port: 5353, protocol: UDP}
        - {port: 5353, protocol: TCP}
    # API service DNAT may be enforced before or after NetworkPolicy evaluation.
    # Restrict to TLS API ports; no unrestricted DNS or web egress.
    - ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
    - to:
        - ipBlock: {cidr: 157.228.139.163/32}
        - ipBlock: {cidr: 89.35.119.225/32}
      ports:
        - {port: 80, protocol: TCP}
