global
    maxconn 64
    nbthread 1
    hard-stop-after 10s

defaults
    mode http
    no log
    timeout connect 750ms
    timeout queue 100ms
    timeout client 9500ms
    timeout server 7500ms
    timeout http-request 500ms
    timeout http-keep-alive 1s
    timeout check 1500ms
    retries 1
    retry-on conn-failure
    option redispatch 1
    option http-server-close
    http-reuse never

frontend api
    bind :8081
    default_backend unified_api

frontend internal_health
    bind :8404
    http-request return status 200 content-type text/plain string alive if { path /healthz }
    http-request return status 200 content-type text/plain string ready if { path /ready } { nbsrv(unified_api) gt 0 }
    http-request return status 503 if { path /ready }
    http-request use-service prometheus-exporter if { path /metrics }
    http-request deny deny_status 404

backend unified_api
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/v1/servers/localhost ver HTTP/1.1 hdr Host localhost hdr X-API-Key "%[env(PDNS_API_KEY)]"
    http-check expect status 200
    default-server check inter 2s fastinter 1s downinter 2s fall 2 rise 2 init-state fully-down maxconn 8
    server msk ${MSK_VPN_ADDRESS}:18081
    server fin ${FIN_VPN_ADDRESS}:18081
