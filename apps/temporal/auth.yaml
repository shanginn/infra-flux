apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-local-auth
  namespace: temporal
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-local-auth-data
  namespace: temporal
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-local-auth
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal-local-auth
    app.kubernetes.io/part-of: temporal
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-local-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-local-auth
        app.kubernetes.io/part-of: temporal
    spec:
      serviceAccountName: temporal-local-auth
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal-local-auth
          image: docker.io/shanginn/temporal-local-auth@sha256:44be41f7d86c8247de9c8f8a4de7e6e9baf616668db72fe2a391c3654edd35e5
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_AUTH_LISTEN_ADDRESS
              value: ":8080"
            - name: TEMPORAL_AUTH_UPSTREAM_URL
              value: "http://temporal-web:8080"
            - name: TEMPORAL_AUTH_PUBLIC_URL
              value: "https://temporal.rubase.shanginn.io"
            - name: TEMPORAL_AUTH_GRPC_ADDRESS
              value: "temporal-grpc.rubase.shanginn.io:443"
            - name: TEMPORAL_AUTH_GRPC_TLS
              value: "true"
            - name: TEMPORAL_AUTH_DATABASE_PATH
              value: "/data/temporal-auth.db"
            - name: TEMPORAL_AUTH_SIGNING_KEY_PATH
              value: "/data/signing-key.pem"
            - name: TEMPORAL_AUTH_ISSUER
              value: "https://temporal.rubase.shanginn.io"
            - name: TEMPORAL_AUTH_AUDIENCE
              value: "temporal-rubase"
            - name: TEMPORAL_AUTH_SESSION_TTL
              value: "12h"
            - name: TEMPORAL_AUTH_PROXY_TOKEN_TTL
              value: "2m"
            - name: TEMPORAL_AUTH_API_TOKEN_TTL
              value: "15m"
            - name: TEMPORAL_AUTH_REFRESH_TOKEN_TTL
              value: "720h"
            - name: TEMPORAL_AUTH_OIDC_CLIENT_ID
              value: "temporal-ui"
            - name: TEMPORAL_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: temporal-local-auth-oidc
                  key: client-secret
            - name: TEMPORAL_AUTH_OIDC_REDIRECT_URL
              value: "https://temporal.rubase.shanginn.io/auth/sso/callback"
            - name: TEMPORAL_AUTH_COOKIE_SECURE
              value: "true"
            - name: TEMPORAL_AUTH_TRUSTED_PROXY_CIDRS
              value: "10.42.0.0/24"
            - name: TMPDIR
              value: "/tmp"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /.well-known/jwks.json
              port: http
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: temporal-local-auth-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-local-auth
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal-local-auth
    app.kubernetes.io/part-of: temporal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal-local-auth
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-local-auth
  namespace: temporal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal-local-auth
  policyTypes:
    - Ingress
  ingress:
    # Temporal initializes its JWT key provider in every server role, even
    # though authorization decisions are made at the frontend boundary.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
              app.kubernetes.io/instance: temporal
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-internal-frontend
  namespace: temporal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/instance: temporal
      app.kubernetes.io/component: internal-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: temporal
      ports:
        - port: 6936
          protocol: TCP
        - port: 7233
          protocol: TCP
        - port: 7246
          protocol: TCP
        - port: 9090
          protocol: TCP
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - default
                  - flowerswork
                  - mystaro
                  - primerochka
                  - restavrach
                  - vibesites
                  - vibesites-pi
      ports:
        - port: 7233
          protocol: TCP
