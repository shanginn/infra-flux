# Standalone owner. This file is not referenced by a parent Kustomization.
# Create the private substitution map and validate the exact candidate first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: legacy-powerdns-read-forwarder
  namespace: flux-system
spec:
  interval: 1m
  timeout: 3m
  retryInterval: 30s
  path: ./bootstrap/dns/read-route/contabo-forwarder
  prune: true
  wait: true
  suspend: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: vibesites-dns
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: legacy-dns-read-forwarder
        optional: false
