apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
  namespace: temporal
  annotations:
    temporal.shanginn.io/server-image-oci-index: sha256:948e10a83115ff80f0cb5def325603d200dad9e29d59c56fab0896f20fe5eae0
spec:
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: temporal-frontend
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: temporal-frontend
              spec:
                selector:
                  app.kubernetes.io/component: internal-frontend
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: temporal-web
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: temporal-web
              spec:
                template:
                  spec:
                    containers:
                      - name: temporal-web
                        env:
                          - name: TEMPORAL_ADDRESS
                            value: "temporal-authenticated-frontend.temporal.svc:7233"
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: temporal-frontend
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: temporal-frontend
              spec:
                template:
                  metadata:
                    annotations:
                      temporal.shanginn.io/meilisearch-config: c7ff619fad7fc38fac223d315c77796970a3d540e7e2741b0b6665bb77c179b2
                  spec:
                    containers:
                      - name: temporal-frontend
                        startupProbe:
                          tcpSocket:
                            port: rpc
                          failureThreshold: 360
                          periodSeconds: 2
                          timeoutSeconds: 1
                        readinessProbe:
                          tcpSocket:
                            port: rpc
                          failureThreshold: 3
                          periodSeconds: 5
                          timeoutSeconds: 1
                    volumes:
                      - name: config
                        configMap:
                          name: temporal-meilisearch-config
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: temporal-internal-frontend
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: temporal-internal-frontend
              spec:
                template:
                  metadata:
                    annotations:
                      temporal.shanginn.io/meilisearch-config: c7ff619fad7fc38fac223d315c77796970a3d540e7e2741b0b6665bb77c179b2
                  spec:
                    containers:
                      - name: temporal-internal-frontend
                        startupProbe:
                          tcpSocket:
                            port: rpc
                          failureThreshold: 360
                          periodSeconds: 2
                          timeoutSeconds: 1
                        readinessProbe:
                          tcpSocket:
                            port: rpc
                          failureThreshold: 3
                          periodSeconds: 5
                          timeoutSeconds: 1
                    volumes:
                      - name: config
                        configMap:
                          name: temporal-meilisearch-config
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: temporal-history
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: temporal-history
              spec:
                template:
                  metadata:
                    annotations:
                      temporal.shanginn.io/meilisearch-config: c7ff619fad7fc38fac223d315c77796970a3d540e7e2741b0b6665bb77c179b2
                  spec:
                    containers:
                      - name: temporal-history
                        startupProbe:
                          tcpSocket:
                            port: rpc
                          failureThreshold: 360
                          periodSeconds: 2
                          timeoutSeconds: 1
                        readinessProbe:
                          tcpSocket:
                            port: rpc
                          failureThreshold: 3
                          periodSeconds: 5
                          timeoutSeconds: 1
                    volumes:
                      - name: config
                        configMap:
                          name: temporal-meilisearch-config
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: temporal-matching
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: temporal-matching
              spec:
                template:
                  metadata:
                    annotations:
                      temporal.shanginn.io/meilisearch-config: c7ff619fad7fc38fac223d315c77796970a3d540e7e2741b0b6665bb77c179b2
                  spec:
                    containers:
                      - name: temporal-matching
                        startupProbe:
                          tcpSocket:
                            port: rpc
                          failureThreshold: 360
                          periodSeconds: 2
                          timeoutSeconds: 1
                        readinessProbe:
                          tcpSocket:
                            port: rpc
                          failureThreshold: 3
                          periodSeconds: 5
                          timeoutSeconds: 1
                    volumes:
                      - name: config
                        configMap:
                          name: temporal-meilisearch-config
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: temporal-worker
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: temporal-worker
              spec:
                template:
                  metadata:
                    annotations:
                      temporal.shanginn.io/meilisearch-config: c7ff619fad7fc38fac223d315c77796970a3d540e7e2741b0b6665bb77c179b2
                  spec:
                    containers:
                      - name: temporal-worker
                        startupProbe:
                          tcpSocket:
                            port: membership
                          failureThreshold: 360
                          periodSeconds: 2
                          timeoutSeconds: 1
                        readinessProbe:
                          tcpSocket:
                            port: membership
                          failureThreshold: 3
                          periodSeconds: 5
                          timeoutSeconds: 1
                    volumes:
                      - name: config
                        configMap:
                          name: temporal-meilisearch-config
  chart:
    spec:
      chart: temporal
      version: "0.72.0"
      sourceRef:
        kind: HelmRepository
        name: temporal
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    serviceAccount:
      create: true
      name: "temporal"
    server:
      replicaCount: 1
      image:
        repository: rubase.local/temporal-meilisearch
        tag: "rubase-v1.29.6.1-ac66573"
        pullPolicy: Never
      additionalEnv:
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: meilisearch
              key: master-key
      internalFrontend:
        enabled: true
        service:
          # Keep the established worker destination port. NetworkPolicy
          # implementations evaluate the post-Service pod port.
          port: 7233
      config:
        numHistoryShards: 512
        authorization:
          jwtKeyProvider:
            keySourceURIs:
              - "http://temporal-local-auth.temporal.svc.cluster.local:8080/.well-known/jwks.json"
            refreshInterval: 1m
          permissionsClaimName: permissions
          audience: temporal-rubase
          authorizer: default
          claimMapper: default
        persistence:
          default:
            driver: "sql"
            sql:
              driver: "postgres12"
              host: "main-db-rw.database.svc.cluster.local"
              port: 5432
              database: "temporal"
              user: "temporal_user"
              password: "" # Password managed by secret
              existingSecret: "temporal-db-user"
              maxConns: 2
              maxIdleConns: 1
              maxConnLifetime: "1h"
          visibility:
            driver: "sql"
            sql:
              driver: "postgres12"
              host: "main-db-rw.database.svc.cluster.local"
              port: 5432
              database: "temporal_visibility"
              user: "temporal_user"
              password: "" # Password managed by secret
              existingSecret: "temporal-db-user"
              maxConns: 2
              maxIdleConns: 1
              maxConnLifetime: "1h"
      dynamicConfig:
        system.secondaryVisibilityWritingMode:
          - value: "dual"
            constraints: {}
        system.enableReadFromSecondaryVisibility:
          - value: true
            constraints:
              namespace: default
          - value: true
            constraints:
              namespace: vibesites
          - value: false
            constraints: {}
        system.visibilityDisableOrderByClause:
          - value: false
            constraints:
              namespace: default
          - value: false
            constraints:
              namespace: vibesites
          - value: true
            constraints: {}
    schema:
      createDatabase:
        enabled: true
      setup:
        enabled: true
      update:
        enabled: true
    admintools:
      enabled: true
      image:
        repository: temporalio/admin-tools
        tag: "1.29.6.1-tctl-1.18.4-cli-1.7.0"
        pullPolicy: IfNotPresent
    web:
      enabled: true
      additionalEnv:
        - name: TEMPORAL_CORS_ORIGINS
          value: "https://temporal.rubase.shanginn.io"
      ingress:
        enabled: false
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-temporal-redirect-https@kubernetescrd
        hosts:
          - "temporal.shanginn.io"
        tls:
          - secretName: temporal-tls
            hosts:
              - "temporal.shanginn.io"
    elasticsearch:
      enabled: false
    prometheus:
      enabled: false
    grafana:
      enabled: false
    cassandra:
      enabled: false
