# Remains inactive until final data and producer handover checks pass.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-edge
spec:
  replicas: 0
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: contabo-app-edge}
  template:
    metadata:
      labels: {app.kubernetes.io/name: contabo-app-edge}
    spec:
      nodeSelector: {kubernetes.io/hostname: home}
      serviceAccountName: app-edge
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: docker.io/library/nginx@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
          command: [nginx, -g, 'daemon off;']
          ports: [{name: https, containerPort: 8443}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '2', memory: 512Mi}
          startupProbe:
            tcpSocket: {port: https}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: mystaro-tls, mountPath: /etc/app-edge/tls/mystaro, readOnly: true}
            - {name: sistent-tls, mountPath: /etc/app-edge/tls/sistent, readOnly: true}
            - {name: generach-tls, mountPath: /etc/app-edge/tls/generach, readOnly: true}
            - {name: inswapper-tls, mountPath: /etc/app-edge/tls/inswapper, readOnly: true}
            - {name: inswapper-client-ca, mountPath: /etc/app-edge/client-ca, readOnly: true}
      volumes:
        - name: config
          configMap: {name: app-edge-nginx}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
        - name: cache
          emptyDir: {sizeLimit: 16Gi}
        - name: mystaro-tls
          secret: {secretName: edge-mystaro-tls, defaultMode: 0440}
        - name: sistent-tls
          secret: {secretName: edge-sistent-tls, defaultMode: 0440}
        - name: generach-tls
          secret: {secretName: edge-generach-tls, defaultMode: 0440}
        - name: inswapper-tls
          secret: {secretName: edge-inswapper-tls, defaultMode: 0440}
        - name: inswapper-client-ca
          secret: {secretName: edge-inswapper-client-ca, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: app-edge
spec:
  selector: {app.kubernetes.io/name: contabo-app-edge}
  ports: [{name: https, port: 8443, targetPort: https}]
